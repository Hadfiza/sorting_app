<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyodide Component</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">

    <style>
        /* CSS Dasar Halaman (Bukan Full Screen) */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #e2e2e2; /* Background halaman abu-abu terang */
            padding: 40px;
            margin: 0;
            display: flex;
            justify-content: center; /* Posisi di tengah secara horizontal */
        }

        /* Ini adalah Kotak Utama Aplikasi (Widget) */
        .app-wrapper {
            width: 100%;
            max-width: 1000px; /* Lebar maksimal */
            height: 600px;     /* Tinggi Tetap */
            background: #1e1e1e;
            border-radius: 12px; /* Sudut membulat */
            box-shadow: 0 15px 30px rgba(0,0,0,0.3); /* Efek bayangan */
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header di dalam kotak */
        header {
            padding: 15px 20px;
            background: #2d2d2d;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        h1 { margin: 0; font-size: 1.1rem; }

        /* Container Split Kiri-Kanan */
        .split-container {
            display: flex;
            flex: 1;
            overflow: hidden; /* Agar konten tidak keluar kotak */
        }

        /* Panel Kiri (Editor) */
        .panel-left {
            flex: 6; /* Lebar 60% */
            border-right: 1px solid #444;
            display: flex;
            flex-direction: column;
        }

        /* Panel Kanan (Output) */
        .panel-right {
            flex: 4; /* Lebar 40% */
            display: flex;
            flex-direction: column;
            background: #101010;
        }

        .panel-label {
            background: #333;
            color: #ccc;
            padding: 5px 15px;
            font-size: 0.8rem;
            text-transform: uppercase;
            border-bottom: 1px solid #444;
        }

        /* CodeMirror Setup */
        .CodeMirror {
            flex-grow: 1;
            height: 100%;
        }

        /* Output Setup */
        #output {
            padding: 15px;
            color: #00ff00;
            font-family: monospace;
            white-space: pre-wrap;
            overflow-y: auto;
            flex-grow: 1;
            font-size: 14px;
        }

        /* Tombol */
        button {
            padding: 8px 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:disabled { background: #555; }
        #status { color: #aaa; font-size: 0.9rem; margin-right: 10px; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        
        <header>
            <h1>🐍 Python Editor</h1>
            <div>
                <span id="status">⏳ Loading Pyodide...</span>
                <button id="runBtn" disabled>▶ Run Code</button>
            </div>
        </header>

        <div class="split-container">
            <div class="panel-left">
                <div class="panel-label">Input Code</div>
                <textarea id="code">
def segitiga(n):
    for i in range(1, n + 1):
        print("*" * i)

print("Membuat pola segitiga:")
segitiga(5)

print("\nMenghitung angka:")
total = 0
for x in [10, 20, 30]:
    total += x
print(f"Total penjumlahan: {total}")
                </textarea>
            </div>

            <div class="panel-right">
                <div class="panel-label">Console Output</div>
                <div id="output"></div>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

    <script>
        // Setup Editor
        var editor = CodeMirror.fromTextArea(document.getElementById("code"), {
            mode: {name: "python", version: 3},
            theme: "dracula",
            lineNumbers: true,
            indentUnit: 4
        });

        // Setup Pyodide
        const outputDiv = document.getElementById("output");
        const runBtn = document.getElementById("runBtn");
        const statusSpan = document.getElementById("status");
        let pyodideInstance = null;

        function addToOutput(text) {
            outputDiv.innerText += text + "\n";
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }

        async function main() {
            try {
                pyodideInstance = await loadPyodide({
                    stdout: (text) => addToOutput(text),
                    stderr: (text) => addToOutput(text)
                });
                runBtn.disabled = false;
                statusSpan.innerText = "";
            } catch (err) {
                statusSpan.innerText = "Error Loading";
            }
        }

        runBtn.addEventListener('click', async () => {
            outputDiv.innerText = ""; // Clear output
            const code = editor.getValue();
            try {
                runBtn.disabled = true;
                await pyodideInstance.runPythonAsync(code);
            } catch (err) {
                addToOutput(err);
            } finally {
                runBtn.disabled = false;
            }
        });

        main();
    </script>

</body>
</html>
